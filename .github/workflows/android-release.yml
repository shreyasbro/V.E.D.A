name: Release Android V.E.D.A.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    if: github.ref_type == 'tag' || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'release(android): v1.0.2'))
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Extract Release Tag & Version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v1.0.2"
          fi
          CLEAN="${TAG#v}"
          CLEAN="${CLEAN#V}"
          echo "VERSION=$CLEAN" >> "$GITHUB_OUTPUT"
          echo "TAG_NAME=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Asset and Generate SHA-256
        run: |
          APK_NAME="VEDA-Mobile.apk"
          SHA_NAME="VEDA-Mobile.apk.sha256"
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-assets/${APK_NAME}"
          cd release-assets
          sha256sum "${APK_NAME}" > "${SHA_NAME}"
          cat "${SHA_NAME}"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          name: "V.E.D.A. Release ${{ steps.get_version.outputs.TAG_NAME }}"
          body: |
            ## V.E.D.A. v1.0.2

            ### What's New
            - Fixed the Gemini callbackFlow lifecycle error.
            - Ensured awaitClose is terminal in callbackFlow blocks.
            - Improved Gemini/SSE listener cleanup and cancellation handling.
            - Updated Android version metadata to 1.0.2.

            ### Android
            - VEDA-Mobile.apk
            - SHA-256 checksum included.

          files: |
            release-assets/VEDA-Mobile.apk
            release-assets/VEDA-Mobile.apk.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
